name = "baja-ai-builders-newsletter"
main = "index.js"
compatibility_date = "2026-07-01"

# Route the worker on your own domain (requires the zone on Cloudflare),
# or skip this and use the default *.workers.dev URL.
# routes = [
#   { pattern = "newsletter.bajaaibuilders.com", custom_domain = true }
# ]

[vars]
# Optional: Resend segment to add new contacts to.
RESEND_SEGMENT_ID = "RESEND_SEGMENT_ID"
RESEND_API_KEY = "RESEND_API_KEY"

[observability.logs]
enabled = true
invocation_logs = true
